<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedLib — Educational Video Library</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="menuToggle" aria-label="Toggle sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <div class="brand">
    <span class="brand-mark">Med</span><span class="brand-mark accent">Lib</span>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="search" id="searchInput" placeholder="Search titles, tags, descriptions…" autocomplete="off">
  </div>

  <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
  </button>
</header>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3>Subjects</h3>
      <ul class="filter-list" id="categoryList"></ul>
    </div>

    <div class="sidebar-section">
      <h3>Platform</h3>
      <ul class="filter-list" id="platformList"></ul>
    </div>

    <div class="sidebar-section">
      <h3>Level</h3>
      <ul class="filter-list" id="levelList"></ul>
    </div>

    <div class="sidebar-section">
      <h3>Tags</h3>
      <div class="tag-cloud" id="tagCloud"></div>
    </div>

    <button class="clear-btn" id="clearFilters">Clear all filters</button>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <main class="content">

    <section class="hero" id="hero">
      <div class="hero-media" id="heroMedia"></div>
      <div class="hero-scrim"></div>
      <div class="hero-info">
        <span class="platform-badge" id="heroPlatform"></span>
        <h1 id="heroTitle"></h1>
        <p id="heroMeta" class="hero-meta"></p>
        <p id="heroDesc" class="hero-desc"></p>
        <div class="hero-actions">
          <button class="btn-play" id="heroPlay">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 4l15 8-15 8V4z" fill="currentColor"/></svg>
            Play
          </button>
        </div>
      </div>
    </section>

    <div id="rowsView">
      <div id="categoryRows"></div>
    </div>

    <div id="gridView" hidden>
      <div class="content-header">
        <h1 id="resultsTitle">All Subjects</h1>
        <span class="results-count" id="resultsCount"></span>
      </div>

      <div class="active-filters" id="activeFilters"></div>

      <section class="card-grid" id="cardGrid"></section>

      <p class="empty-state" id="emptyState" hidden>No videos match your filters. Try clearing some.</p>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-body">
      <span class="platform-badge" id="modalPlatform"></span>
      <h2 id="modalTitle"></h2>
      <p class="modal-meta" id="modalMeta"></p>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="tag-row" id="modalTags"></div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/videos.generated.js"></script>
<script src="js/app.js"></script>
</body>
</html>
