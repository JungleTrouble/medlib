# ------------------------------------------------------------
#  Tier 1 - regex patterns with a named capture group.
#  `field` names the group; its value is normalised (lowercased, whitespace
#  collapsed) and looked up in `map`. A miss falls through to the next tier.
#  – in the character classes is an en dash; titles use both dash forms.
# ------------------------------------------------------------
patterns:
  # "007 - General Topics - Informed Consent"  ->  section = "general topics"
  # The middle field is the publisher's own section name, so it is trusted
  # over keyword guessing.
  - name: numbered-section
    regex: '^\s*\d+\s*[-–]\s*(?P<section>[^-–]+?)\s*[-–]\s*.+$'
    field: section
    # Labels that carry no subject signal. Matching one marks the title as
    # structured-but-unmapped, which skips the prefix and range tiers.
    skip_values: ["other", "misc"]
    map:
      "pathology": pathology
      "obstetrics": obgyn
      "gynecology": obgyn
      "breast": obgyn
      "red cells": heme
      "white cells": heme
      "coagulation": heme
      "pulmonary disease": pulmonology
      "other pulmonary topics": pulmonology
      "anatomy and orthopedics": musculoskeletal
      "trauma": emergency
      "emergencies": emergency
      "critical care": emergency
      "liver": gastro
      "biliary tree and pancreas": gastro
      "esophagus and stomach": gastro
      "intestines": gastro
      "general pediatrics": pediatrics
      "newborns": pediatrics
      "psychiatric disorders": psychiatry
      "abnormal psychology": psychiatry
      "psychopharmacology": psychiatry
      "substance abuse": psychiatry
      "diabetes": endocrine
      "thyroid gland": endocrine
      "adrenal glands": endocrine
      "acid base": renal
      "fluids and electrolytes": renal
      "glomerular disease": renal
      "renal failure": renal
      "arrhythmias": cardiology
      "heart failure": cardiology
      "cardiac auscultation": cardiology
      "ischemic heart disease": cardiology
      "antibiotics": infectious
      "hiv": infectious
      "fungi and parasites": microbiology
      "stroke and hemorrhage": neurology
      "demyelinating disorders": neurology
      "movement disorders": neurology
      "seizures": neurology
      "anesthesia": surgery
      "surgery": surgery
      "pharmacology": pharmacology
      "general topics": publichealth
      "embryology, anatomy and physiology": embryology
      "cell biology": biochemistry
      "immunology": immunology
      "dermatology": dermatology
      "ophthalmology": ophthalmology
      "rheumatology": rheumatology
      "genetics": genetics
      "biochemistry": biochemistry
      "microbiology": microbiology
      "neurology": neurology
      "cardiology": cardiology
      "endocrinology": endocrine
      "nephrology": renal
      "hematology": heme
      "oncology": oncology
      "gastroenterology": gastro
      "infectious disease": infectious
      "psychiatry": psychiatry
      "pediatrics": pediatrics
      "radiology": radiology

  # "Cardio / 014 - Preload", "Neuro__03 - Stroke" - a subject word joined by a
  # separator the leading-token tier does not stop at.
  - name: qualified-subject
    regex: '^\s*(?P<subject>[A-Za-z]{2,16})\s*(?:/|__|::)\s*\S'
    field: subject
    map:
      "cardio": cardiology
      "pulm": pulmonology
      "neuro": neurology
      "gi": gastro
      "renal": renal
      "endo": endocrine
      "heme": heme
      "msk": musculoskeletal
      "derm": dermatology
      "peds": pediatrics
      "psych": psychiatry
      "obgyn": obgyn
      "micro": microbiology
      "path": pathology
      "pharm": pharmacology
      "biochem": biochemistry
      "anat": anatomy
      "histo": histology
      "embryo": embryology

# ------------------------------------------------------------
#  Tier 2 - exact leading-token match, e.g. "Cardio_014 - Preload.mp4".
#  Compared after lowercasing and cutting at the first `match.separators` char.
#
#  Only topic-word prefixes are enabled by default. Bare numeric prefixes are
#  deliberately absent: in this library "01 Acute Leukemia" and "01 Adrenal
#  Gland" are within-section indices, not subject codes, so a numeric map would
#  file several hundred files under one confidently wrong bucket. Enable them
#  only for a tree whose numbering really is a subject code:
#
#    "01": anatomy
#    "02": physiology
#
#  Run `--dry-run --list-unmatched` after any change and check the tier
#  breakdown before trusting the result.
# ------------------------------------------------------------
prefixes:
  cardio: cardiology
  cards: cardiology
  cv: cardiology
  pulm: pulmonology
  resp: pulmonology
  neuro: neurology
  neuroanat: neurology
  gi: gastro
  git: gastro
  hepat: gastro
  renal: renal
  nephro: renal
  uro: renal
  endo: endocrine
  heme: heme
  hemeonc: heme
  onc: oncology
  msk: musculoskeletal
  ortho: musculoskeletal
  rheum: rheumatology
  derm: dermatology
  repro: reproductive
  ophtho: ophthalmology
  ent: ent
  oto: ent
  obgyn: obgyn
  gyn: obgyn
  peds: pediatrics
  psych: psychiatry
  surg: surgery
  anes: surgery
  rad: radiology
  micro: microbiology
  immuno: immunology
  path: pathology
  pharm: pharmacology
  biochem: biochemistry
  physio: physiology
  anat: anatomy
  histo: histology
  embryo: embryology
  biostat: biostats
  cna: nursing

# ------------------------------------------------------------
#  Tier 3 - numeric ranges, for a tree where the lecture number encodes the
#  subject ("230-Beta Blockers.mp4"). Inclusive on both ends, checked in order,
#  so put narrower ranges first where they overlap.
#
#  Empty by default for the same reason the numeric prefixes are: guessed
#  ranges mis-file real content. Fill in the bands your library actually uses:
#
#    - { from: 200, to: 249, bucket: pharmacology }
#    - { from: 250, to: 299, bucket: microbiology }
# ------------------------------------------------------------
ranges: []

# ------------------------------------------------------------
#  Tier 4 - weighted keyword fallback for anything the prefix tiers miss.
#  Multi-word phrases carry more weight than bare words so a title like
#  "cardiac muscle histology" resolves to histology instead of ping-ponging
