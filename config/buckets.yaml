# ------------------------------------------------------------
#  Content-format tags, applied on top of whichever bucket won.
#  Matched case-insensitively against the full title.
# ------------------------------------------------------------
tags:
  - { regex: 'board-?style question|question breakdown', tag: board-style-question }
  - { regex: 'practice question',                        tag: practice-questions }
  - { regex: 'clinical reasoning',                       tag: clinical-reasoning }
  - { regex: "clinician'?s? corner",                     tag: clinicians-corner }
  - { regex: 'clinical correlate',                       tag: clinical-correlates }
  - { regex: '\bhisto(logy)?\b',                         tag: histology }
  - { regex: 'summary|overview|high[- ]yield',           tag: overview }
  - { regex: '\batf\b',                                  tag: atf-series }

# ------------------------------------------------------------
#  Level inference. First matching regex wins; no match -> fallback.
# ------------------------------------------------------------
levels:
  fallback: Uncategorized
  rules:
    - { regex: 'board-?style question|practice question|question breakdown', level: "Board Review" }
    - { regex: "clinical reasoning|clinician'?s? corner|clinical correlate|management|treatment", level: "Clinical" }
    - { regex: 'anatomy|embryolog|histolog|biochem|physiolog|genetic', level: "Preclinical" }

# ------------------------------------------------------------
#  Which files the scanner treats as playable media.
# ------------------------------------------------------------
media_extensions: [".mp4", ".mkv", ".m4v", ".mov", ".webm", ".avi", ".m3u8", ".mpd"]

