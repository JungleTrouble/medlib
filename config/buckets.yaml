# ============================================================
#  Prefix -> subject bucket mappings.
#
#  Consumed by server/categorizer.py. Rule tiers are tried in this order and
#  the first hit wins:
#
#    1. patterns  - regex with a named capture, looked up in its own map
#    2. prefixes  - exact match on the leading token of the filename
#    3. ranges    - numeric leading token falling inside [from, to]
#    4. keywords  - weighted substring scoring over the whole title
#    5. default_bucket
#
#  Exception: when a `patterns` regex matches the *shape* of a name but its
#  captured label maps to nothing (a "### - Other Topics - X" title), tiers 2
#  and 3 are skipped and scoring goes straight to keywords. The leading number
#  in such a name is a section index, not a subject code, and letting the
#  prefix/range tiers read it produces confident nonsense.
#
#  Bucket ids match the CATEGORIES ids in js/data.js so this catalog and the
#  existing front-end agree on filter names.
# ============================================================

version: 1
default_bucket: uncategorized
min_keyword_score: 6          # below this, fall through to default_bucket
high_confidence_score: 10     # at or above this, confidence is reported "high"

match:
  case_sensitive: false
  strip_extension: true
  # A leading token ends at the first of these characters.
  separators: ["_", "-", " ", ".", "]", ")"]
  # Stripped from the front of a name before tokenising (disc/part junk).
  strip_leading: ["#", "@", "[", "(", "~"]

# ------------------------------------------------------------
#  Buckets. `label` and `color` are emitted into the catalog so the
#  player can render sidebar entries without a second config file.
# ------------------------------------------------------------
